<script>
    let arr1 = [20, 50, 10, 40, 30];
    arr1.sort();
    console.log(arr1);

    let arr2 = [9, 90, 8, 5, 7, 101, 105, 10, 6, 108];
    arr2.sort(); // not numeric sort, string sort
    console.log(arr2);

    // Numeric sort
    let arr3 = [9, 90, 8, 5, 7, 101, 105, 10, 6, 108];
    arr3.sort((a, b) => a - b);
    console.log(arr3);
</script>
