<script>
    let arr = [10, 12, 14, 16, 18, 19];

    let isEveryElementEven = arr.every(ele => ele % 2 == 0);
    console.log('isEveryElementEven: ', isEveryElementEven)

    let atleastOneElementEvent = arr.some(ele => ele % 2 == 0);
    console.log('atleastOneElementEvent: ', atleastOneElementEvent)
</script>
