<script>
    class Movie {
        name;
        genre;
        releaseYear;
        language;
        constructor(name, genre, releaseYear, language) {
            this.name = name;
            this.genre = genre;
            this.releaseYear = releaseYear;
            this.language = language;
        }
    }
    let movie_1 = new Movie('3 Idiots', 'Drama', 2009, 'Hindi');
    console.log('movie_1: ', movie_1);

    let movie_2 = new Movie('Maharaja', 'Thriller', 2023, 'Tamil');
    console.log('movie_2: ', movie_2)
</script>
