<script>
    let str = 'Javascript';

    console.log('String Length: ', str.length); // 10
    console.log(str.toUpperCase());
    console.log(str.toLowerCase());

    // at() supports -ve index also
    console.log(str[1]);          // a
    console.log(str.charAt(1));  // a
    console.log(str.at(1));      // a

    console.log(str[-2]);          // 
    console.log(str.charAt(-2));  // 
    console.log(str.at(-2));      // a

    console.log(str.charCodeAt(1)); // a = 97

    console.log('virat'.concat(' kohli')); 
</script>
