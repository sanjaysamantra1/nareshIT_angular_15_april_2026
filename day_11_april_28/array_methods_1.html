<script>
    let arr = [10, 20, 30];

    console.log('Before Push  Arr: ', arr);
    arr.push(40, 50);
    console.log('After Push Arr: ', arr);

    arr.pop();
    console.log('After pop Arr: ', arr);

    arr.unshift(50);
    console.log('After unshift Arr: ', arr);
    
    arr.shift();
    console.log('After shift Arr: ', arr); // [10, 20, 30, 40]
</script>
